# Alembic command-line configuration, used only to author new revisions.
# The application runs migrations programmatically (adle_core/infrastructure/migrate.py).

[alembic]
script_location = adle_core/migrations
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 48

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
