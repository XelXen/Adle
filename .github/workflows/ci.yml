name: CI

on:
  push:
    # Work happens on dev; main is what has been released.
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A Python that uv manages, the same one on every machine, never the machine's own.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  checks:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Python dependencies
        run: npm run core:sync
      - name: Contracts, format, lint, types, unit tests
        run: node scripts/check.mjs
      - name: Dependency audit (npm)
        run: npm audit --audit-level=high
      - name: Dependency audit (Python, everything in uv.lock)
        run: |
          uv export --directory services/core --frozen --no-emit-project --no-hashes --format requirements-txt --quiet --output-file requirements-audit.txt
          uv tool run pip-audit -r services/core/requirements-audit.txt --disable-pip --no-deps

  e2e:
    name: End-to-end (${{ matrix.os }})
    needs: checks
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Download the pinned Electron binary
        run: npx install-electron --no
      - name: Install Python dependencies
        run: npm run core:sync
      - name: Run end-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: npm run e2e
      - name: Run end-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        # Run from its folder, Electron's sandbox helper is nobody's, so the sandbox is built
        # from namespaces, which this build machine is told to allow. The sandbox stays on.
        run: |
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0 || true
          xvfb-run --auto-servernum npm run e2e
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.os }}
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 7

  installers:
    name: Installers
    needs: checks
    uses: ./.github/workflows/build.yml
