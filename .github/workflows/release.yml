name: Release

# A tag "v<version>" is all it takes to publish that version: the installers are built on
# each system they are for, tried out there, and attached to a release with their checksums.
# The tag has to be the version in package.json, and the changelog has to have that version.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notes:
    name: Check the tag and write the notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: The tag is this version's, and the changelog has it
        run: node scripts/release-notes.mjs --tag="$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build
    needs: notes
    uses: ./.github/workflows/build.yml
    with:
      keep-days: 14

  publish:
    name: Publish
    needs: [notes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # To make the release and attach the installers. Nothing else here can write.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: Checksums
        working-directory: release
        run: |
          sha256sum Adle-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A version with a hyphen in it (an alpha, a beta) is marked as a pre-release.
          kind=()
          case "$GITHUB_REF_NAME" in *-*) kind+=(--prerelease) ;; esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Run again for a release that is there already: its files are replaced.
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md "${kind[@]}"
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --title "Adle ${GITHUB_REF_NAME#v}" \
              --notes-file release-notes.md \
              "${kind[@]}"
          fi
